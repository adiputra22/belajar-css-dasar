<!DOCTYPE html>
<html>
<head>
    <style>
        p.one {
            border-style: solid;
            border-width: 5px 20px; /* 5px atas and bawah, 20px untuk kanan dan kiri */
        }

        p.two {
            border-style: solid;
            border-width: 20px 5px; /* 20px atas and bawah, 5px untuk kanan dan kiri */
        }

        p.three {
            border-style: solid;
            border-width: 25px 10px 4px 35px; /* 25px atas, 10px kanan, 4px bawah and 35px kiri */
        }
    </style>
</head>
<body>

    <h2>The border-width Property</h2>
    <p>Keterangan: bisa memiliki dari satu hingga empat nilai (untuk border atas, border kanan, border bawah, dan border kiri):</p>

    <p class="one">Some text.</p>
    <p class="two">Some text.</p>
    <p class="three">Some text.</p>

</body>
</html>
