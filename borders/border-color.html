<!DOCTYPE html>
<html>
<head>
<style>
p.one {
  border-style: solid;
  border-color: red; /* merah semua sisi */
}

p.two {
  border-style: solid;
  border-color: green blue yellow green; /* atas hijau, kanan biru, bawah kuning, kiri hijau */
} 

p.three {
  border-style: dotted;
  border-color: blue purple; /* atas dan bawah berwarna biru, kanan dan kiri berwarna ungu */
} 
</style>
</head>
<body>

<h2>The border-color Property</h2>

<p class="one">Konten 1</p>
<p class="two">Konten 2</p>
<p class="three">Konten 3</p>

<p><b>Note:</b> "border-color" property tidak bekerja jika digunakan sendiri. Gunakan properti "border-style" untuk mengatur border terlebih dahulu.</p>

</body>
</html>
